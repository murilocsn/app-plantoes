name: Validate app.js

on:
  push:
    paths:
      - 'app.js'
      - '.github/workflows/validate-app-js.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app.js syntax
        run: node --check app.js
