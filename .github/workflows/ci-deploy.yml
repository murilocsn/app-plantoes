name: CI e deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validar projeto
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Testar publicação
        run: node --test scripts/deploy-render.test.mjs

      - name: Build
        run: npm run build

  deploy-render:
    name: Publicar API no Render
    timeout-minutes: 15
    concurrency:
      group: render-api-producao
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Disparar deploy
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          RENDER_DEPLOY_COMMIT: ${{ github.sha }}
          RENDER_VERIFY_URL: https://app-plantoes.onrender.com/version
        run: npm run deploy:render
